# TuningBook now lives at https://tuningbook.pages.dev (Cloudflare Pages builds web/ on every push).
# The old GitHub Pages address (5uck1t.github.io/tuningbook) is kept only as a redirect, so old
# bookmarks, installed web apps and shared build links (#/b/…) still arrive at the new site.
name: Deploy redirect to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - web/redirect/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the redirect site
        run: |
          mkdir site
          cp web/redirect/index.html site/index.html
          cp web/redirect/index.html site/404.html
          # An installed web app that is still open checks version.json; a "new" build id makes it
          # offer "Update", which then lands on the redirect.
          echo '{"build":"moved-to-pages-dev"}' > site/version.json
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
